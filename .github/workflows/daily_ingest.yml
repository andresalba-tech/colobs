name: Daily ColObs Ingestion

on:
  schedule:
    # 05:17 UTC = 00:17 Colombia
    - cron: '17 5 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Update ColObs D1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MATON_API_KEY: ${{ secrets.MATON_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate daily D1 update
        run: npx tsx backend/scripts/run_daily_d1_ingestion.ts

      - name: Check generated SQL
        id: sql
        shell: bash
        run: |
          if [ -s backend/data/daily-d1.sql ]; then
            echo "has_sql=true" >> "$GITHUB_OUTPUT"
            echo "SQL update generated."
          else
            echo "has_sql=false" >> "$GITHUB_OUTPUT"
            echo "No new SQL generated."
          fi

      - name: Apply update to Cloudflare D1
        if: steps.sql.outputs.has_sql == 'true'
        run: >
          npx wrangler@4.132.0 d1 execute colobs-db
          --remote
          --file=backend/data/daily-d1.sql
          --yes

      - name: Verify production job count
        run: >
          npx wrangler@4.132.0 d1 execute colobs-db
          --remote
          --command "SELECT COUNT(*) AS jobs FROM jobs;"